# FILE:    .github/workflows/ci.yml
# CREATED: 2026-11-10 11:38 +03
# WHAT:    Build and unit tests (Java 17) on every push and pull request; the jar is kept as an artifact.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kwtsms-keycloak-jar
          path: build/libs/*.jar
