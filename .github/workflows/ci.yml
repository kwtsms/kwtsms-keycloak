# FILE:    .github/workflows/ci.yml
# CREATED: 2026-11-10 11:38 +03
# WHAT:    Build and unit tests (Java 17) on every push and pull request; the jar is kept as an artifact.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kwtsms-keycloak-jar
          path: build/libs/*.jar
