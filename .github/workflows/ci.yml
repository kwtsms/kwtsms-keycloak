# FILE:    .github/workflows/ci.yml
# CREATED: 2026-11-10 11:38 +03
# WHAT:    Build and unit tests (Java 17) on every push and pull request; the jar is kept as an artifact.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: kwtsms-keycloak-jar
          path: build/libs/*.jar
